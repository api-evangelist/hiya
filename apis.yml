aid: hiya
name: Hiya
description: >-
  Hiya is an AI-native voice security company that blocks spam, fraud, and
  deepfake calls at network scale for mobile operators, enterprises, and
  consumers. Its developer platform exposes several REST APIs: Hiya Connect for
  branded outbound calling (registering originating numbers, managing branded
  phone numbers, logos, and managed brands), Hiya Protect for spam and scam
  reputation (business partner reputation submission, spammer and profile-phone
  caches, and voice scam protection reporting), Hiya Audio Intelligence for
  audio-based authenticity, identity, and voiceprint verification (deepfake and
  synthetic-voice detection), and the Hiya AI Voice Platform for call logs,
  contacts, relations, notifications, and an AI voice assistant. APIs are served
  over HTTPS from api.hiya.com with HTTP Basic authentication using an App ID and
  App Secret (bearer tokens for Audio Intelligence), plus iOS and Android mobile
  SDKs for embedding caller ID and protection in apps.
