apis:
- name: Hiya Connect API
  description: >-
    Branded calling API to register outbound originating numbers, manage Connect
    phone numbers and managed brands, upload and manage brand logos, and read
    branded-phones cache and billing analytics so business calls display the
    company name, logo, and call reason.
  humanURL: https://developer.hiya.com/docs/connect/branding/endpoints/v-1-register-outbound-call
  baseURL: https://api.hiya.com
  tags:
  - Branded Calling
  - Caller ID
  properties:
  - type: Documentation
    url: https://developer.hiya.com/docs/connect/branding/endpoints/v-1-register-outbound-call
- name: Hiya Protect API
  description: >-
    Spam and scam protection API covering the business partner reputation
    surface (register businesses and phones, query reputation), spammer and
    profile-phone caches distributed as country-specific gzipped TSV, and voice
    scam protection session reporting.
  humanURL: https://developer.hiya.com/docs/protect/cache/endpoints/v-1-get-profile-phones-cache
  baseURL: https://api.hiya.com
  tags:
  - Spam Protection
  - Reputation
  properties:
  - type: Documentation
    url: https://developer.hiya.com/docs/protect/cache/endpoints/v-1-get-profile-phones-cache
- name: Hiya Audio Intelligence API
  description: >-
    Audio-based authenticity, identity, and voiceprint verification API for
    detecting deepfakes and synthetic voices, managing audios, identities,
    identity/message/authenticity verifications, API keys, org stats, and wallet.
  humanURL: https://developer.hiya.com/docs/audio-intel/introduction
  baseURL: https://api.hiya.com/audiointel
  tags:
  - Deepfake Detection
  - Voice Authentication
  properties:
  - type: Documentation
    url: https://developer.hiya.com/docs/audio-intel/introduction
- name: Hiya AI Voice Platform API
  description: >-
    AI voice assistant and call management API for call logs, contacts,
    relations, user accounts and preferences, notification tokens, call
    feedback, assistant voices, number profiles, and a live-calls websocket.
  humanURL: https://developer.hiya.com/docs/ai-voice-platform/introduction
  baseURL: https://api.hiya.com
  tags:
  - AI Voice Assistant
  - Call Management
  properties:
  - type: Documentation
    url: https://developer.hiya.com/docs/ai-voice-platform/introduction
